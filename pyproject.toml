[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "walker-gait"
version = "0.1.0"
description = "Fine-tuned ViTPose++ for walker-mounted clinical gait analysis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision",
    "transformers>=4.48",
    "accelerate",
    "numpy",
    "scipy",
    "opencv-python",
    "pillow",
    "pyyaml",
    "tqdm",
    "pycocotools",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "notebook", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]
